<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteo Final</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            width: 90%;
            max-width: 500px;
        }

        .foto-perfil {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            margin-top: 0;
        }
        #mensaje-final {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            margin: 1.5rem 0;
            line-height: 1.4;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        @media (max-width: 480px) {
            #mensaje-final {
                font-size: 1.4rem;
            }
            .container {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="wilde.jpg" alt="Foto de perfil" class="foto-perfil">

        <h1>Resultado Final</h1>
        <div id="mensaje-final">
            El conteo final fue de 157 d 14 h 10 m ¿que pienso?, que estoy jodido
        </div>
    </div>

</body>
</html>
